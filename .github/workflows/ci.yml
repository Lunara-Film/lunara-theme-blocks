name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      tested: ${{ steps.reuse.outputs.tested || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the whole PR/push, including renames and large file lists.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify CI routing, required-check, shard and reuse policy
        run: >-
          node --test .github/scripts/ci-policy.test.cjs .github/scripts/browser-shards.test.cjs
          .github/scripts/ci-reuse.test.cjs

      - name: Classify changed files
        id: scope
        run: node .github/scripts/ci-policy.cjs scope

      # A main push skips the full jobs only when this exact tree already passed
      # them on a same-repository pull request (docs/CI.md).
      - name: Reuse the pull request result for an identical tree
        id: reuse
        if: steps.scope.outputs.docs_only == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-reuse.cjs check

  checks:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax
        run: |
          set -e
          find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "PHP clean"

      - name: JS syntax
        run: |
          set -e
          find . \( -name '*.js' -o -name '*.cjs' \) -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | while IFS= read -r -d '' f; do node --check "$f"; done
          echo "JS clean"

      - name: CSS brace balance
        run: |
          python3 - <<'PYEOF'
          import glob, sys
          bad = [f for f in glob.glob('**/*.css', recursive=True) if 'node_modules' not in f
                 and open(f, encoding='utf-8', errors='ignore').read().count('{') != open(f, encoding='utf-8', errors='ignore').read().count('}')]
          if bad:
              print('Unbalanced braces:', bad); sys.exit(1)
          print('CSS balanced')
          PYEOF

      - name: PHP behavior tests
        run: |
          set -e
          for t in tests/*.php; do
            case "$t" in *-cases.php|*-fixture.php) continue ;; esac
            echo "== $t"
            php "$t"
          done

  browser:
    name: Browser tests (${{ matrix.shard }}/6)
    needs: scope
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      # Browser fixtures render the real PHP components.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm ci

      - name: Browser behavior tests
        env:
          LUNARA_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          TEST_SHARD: ${{ matrix.shard }}/6
        run: |
          set -e
          tests=()
          skip=$(awk '!/^#/ && NF {print $1}' tests/ci-skip.txt | tr '\n' ' ')
          for t in tests/*.js tests/*.cjs; do
            [ -e "$t" ] || continue
            case " $skip " in *" $(basename "$t") "*) echo "skip $t (tests/ci-skip.txt)"; continue ;; esac
            tests+=("$t")
          done
          # Explicit discovery includes new tests automatically. Each file runs
          # once across the shards, in its own process, with one browser at a time.
          # Shards are balanced by measured seconds (docs/CI.md), not name order.
          test "${#tests[@]}" -gt 0
          list=$(node .github/scripts/browser-shards.cjs shard "$TEST_SHARD" "${tests[@]}")
          test -n "$list"
          mapfile -t shard <<< "$list"
          node --test --test-concurrency=1 "${shard[@]}"

  # Always report the existing required check. Only a successful documentation
  # classification or a verified identical-tree result permits skipped runtime
  # jobs; failures/cancellation fail CI.
  ci:
    if: always()
    needs: [scope, checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require the complete result for this scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-policy.cjs gate

      # Lets the merge to main reuse this result (.github/scripts/ci-reuse.cjs).
      - name: Name the fully tested tree
        if: github.event_name == 'pull_request' && needs.scope.outputs.docs_only == 'false'
        run: |
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/tested-tree.txt"

      - name: Record the fully tested tree
        if: github.event_name == 'pull_request' && needs.scope.outputs.docs_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ci-passed-tree-${{ env.TESTED_TREE }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 14
          overwrite: true
          if-no-files-found: error
